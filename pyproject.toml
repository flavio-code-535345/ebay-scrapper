[project]
name = "ebay-scrapper"
version = "1.0.0"
description = "eBay deal finder for the German secondhand gaming market"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "database", "models", "scraper", "ebay_api_client", "kleinanzeigen_scraper"]

[tool.setuptools.packages.find]
include = ["ai_providers*", "search*"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
# Live tests hit the real eBay/Kleinanzeigen sites — opt in with `pytest -m live`.
addopts = "-q --tb=short -m 'not live'"
markers = ["live: hits real external sites (opt in with -m live; never run in CI)"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["app", "database", "models", "scraper", "ebay_api_client", "kleinanzeigen_scraper", "ai_providers", "search"]
branch = true
omit = ["test_*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["SIM115", "SIM117", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = false
check_untyped_defs = false
